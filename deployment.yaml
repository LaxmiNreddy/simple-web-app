apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-web-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: simple-web-app
  template:
    metadata:
      labels:
        app: simple-web-app
    spec:
      containers:
        - name: web
          image: simple-web-app:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: simple-web-app
spec:
  type: NodePort
  selector:
    app: simple-web-app
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081